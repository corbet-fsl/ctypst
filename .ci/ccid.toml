schema = 1
project = "ctypst"

[checks.all]
kind = "commands"
commands = [["bash", "-c", "exec 2>&1; exec bash scripts/ci.sh all"]]

[checks.quality]
kind = "commands"
commands = [["bash", "-c", "exec 2>&1; exec bash scripts/ci.sh quality"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["bun", "--version"], ["reuse", "--version"], ["nix", "--version"]]

[checks.test]
kind = "commands"
commands = [["bash", "-c", "exec 2>&1; exec bash scripts/ci.sh test"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["bun", "--version"], ["reuse", "--version"], ["nix", "--version"]]

[checks.python]
kind = "commands"
commands = [["bash", "-c", "exec 2>&1; exec bash scripts/ci.sh python"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["bun", "--version"], ["uv", "--version"], ["reuse", "--version"], ["nix", "--version"]]
cache_env = ["CI_PYTHON"]

[checks.javascript]
kind = "commands"
commands = [["bash", "-c", "exec 2>&1; exec bash scripts/ci.sh javascript"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["bun", "--version"], ["reuse", "--version"], ["nix", "--version"]]

[checks.license]
kind = "commands"
commands = [["bash", "-c", "exec 2>&1; exec bash scripts/ci.sh license"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["bun", "--version"], ["reuse", "--version"], ["nix", "--version"]]

# tools/release (ctypst-release) prepares the crate and the Wasm npm package (a custom Wasm build, not
# `kind = "pack"` work); the release run attaches their files to the draft.
[checks.release-build]
kind = "commands"
commands = [["bash", ".ci/release-build.sh"]]

# All Linux verification gates are covered by the checks above (ci.yml runs
# quality/test/python/javascript on ubuntu-24.04 via scripts/ci.sh; license
# via reuse). commands kind is required: scripts/ci.sh needs package-list
# cleanliness, clippy --all-targets --all-features, per-feature check matrix,
# publish dry-run, maturin/pytest venv, bun/tsc/conformance/pack, reuse lint.
# cache_tools pins the tool identities each script arm resolves
# (rustc/cargo/bun/reuse/nix; python3 and uv only on the python product check); maturin/pytest pins
# live in scripts/ci.sh. jobs.verify is the Linux verify subset;
# release-build is the release run's own check.

[release]
kind = "library"
version = "Cargo.toml"
registries = ["crates", "npm"]
build = ["release-build"]
notes = "CHANGELOG.md"

[render]
render_schema = 3
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["quality", "test", "python", "javascript", "license"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]


[surface]
keep = { ".ci/release-imports/ctypst-0.3.2.json" = "the audited import receipt tools/release reads for the 0.3.2 crate (RELEASING.md)" }
