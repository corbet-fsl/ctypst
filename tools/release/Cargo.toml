[package]
name = "ctypst-release"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
description = "Prepares the immutable packages of a ctypst release (crate and Wasm npm package)"
license = "FSL-1.1-ALv2"
publish = false

# A standalone project: it keeps its own Cargo.lock and is excluded from the ctypst crate.
[workspace]

[dependencies]
flate2 = "1"
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
