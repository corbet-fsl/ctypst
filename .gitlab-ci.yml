# Remote CI on the GitLab mirror: the ccid remote job "windows" (.ci/ccid.toml).
# A pipeline starts only when the remote CI broker creates it by API for one exact commit; pushes
# from the forge's mirror start nothing. The broker reports the result on the forge as "remote / windows".
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $CCID_REMOTE_JOB && $CCID_EXPECTED_SHA'
    - when: never

windows:
  rules:
    - if: '$CCID_REMOTE_JOB == "windows"'
  tags: [saas-windows-medium-amd64]
  timeout: 90m
  variables:
    CARGO_TERM_COLOR: never
    CARGO_INCREMENTAL: "0"
  script:
    - if ($env:CI_COMMIT_SHA -ne $env:CCID_EXPECTED_SHA) { Write-Error "built $env:CI_COMMIT_SHA, requested $env:CCID_EXPECTED_SHA"; exit 1 }
    - Invoke-WebRequest -UseBasicParsing -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --no-modify-path --profile minimal --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - rustc --version --verbose
    # The repository's portable test lane, `scripts/ci.sh test` (rust_tests), as its one command: the
    # hosted Windows image has no Git Bash, so PowerShell runs it directly.
    - cargo test --locked --all-features
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
